name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check Expo native dependency alignment
        run: |
          if npx expo install --check > "$RUNNER_TEMP/expo-dependencies.log" 2>&1; then
            cat "$RUNNER_TEMP/expo-dependencies.log"
          else
            check_status=$?
            cat "$RUNNER_TEMP/expo-dependencies.log"
            node -e 'const fs = require("node:fs"); const log = fs.readFileSync(process.argv[1], "utf8"); console.log("::error::" + log.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A"));' "$RUNNER_TEMP/expo-dependencies.log"
            exit "$check_status"
          fi
      - run: npm run build
        env:
          CI: "1"
