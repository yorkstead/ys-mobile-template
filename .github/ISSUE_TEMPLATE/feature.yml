name: Feature/specification
description: Propose a behavior change with acceptance criteria
body:
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use Given/When/Then or observable checks.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Out of scope
